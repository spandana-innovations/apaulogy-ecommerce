name = "apaulogy-ecommerce"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[vars]
SITE_URL = "https://apaulogy.com"
MEDIA_BASE_URL = "https://cdn.apaulogy.com"
CURRENCY = "INR"

