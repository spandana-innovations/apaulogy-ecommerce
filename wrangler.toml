name = "apaulogy"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[vars]
SITE_URL = "https://apaulogy.com"
MEDIA_BASE_URL = "https://cdn.apaulogy.com"
CURRENCY = "INR"

# D1 database (apaulogyecomm). Migrate with:
#   wrangler d1 execute apaulogyecomm --remote --file=db/migrations-admin.sql
# R2 bucket (apaulogyecomm) for product image uploads